<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Déclic 2de</title>
<meta name="description" content="Maths et physique-chimie de seconde, en images.">
<meta name="theme-color" content="#e4572e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Déclic 2de">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#1d2433; --ink2:#55607a; --line:#e2ddd3;
  --accent:#e4572e; --accent2:#2e6fe4; --ok:#1f9d6b; --ko:#d64545; --warn:#e8a317;
  --soft-ok:#e3f5ec; --soft-ko:#fbe7e7; --soft-acc:#fdebe5; --soft-blue:#e7effd; --soft-warn:#fdf3dc;
  --math:#2e6fe4; --pc:#8a4fd8; --college:#7a8599;
  --shadow:0 2px 10px rgba(29,36,51,.07);
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#13161d; --card:#1c212b; --ink:#eef1f7; --ink2:#a6b0c4; --line:#2f3644;
    --accent:#ff7a52; --accent2:#6b9dff; --ok:#3ccf8e; --ko:#ff6b6b; --warn:#ffc14d;
    --soft-ok:#173328; --soft-ko:#3a1f22; --soft-acc:#3a2419; --soft-blue:#1b2740; --soft-warn:#3a2f17;
    --math:#6b9dff; --pc:#b48af0; --college:#98a2b6;
    --shadow:0 2px 10px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:18px;line-height:1.45}
body{min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;cursor:pointer}
#app{max-width:860px;margin:0 auto;padding:16px 16px 40px;padding-top:max(16px,env(safe-area-inset-top))}
h1{font-size:1.7rem;margin:.2em 0 .1em;letter-spacing:-.01em}
h2{font-size:1.3rem;margin:.6em 0 .4em}
h3{font-size:1.08rem;margin:.6em 0 .3em}
p{margin:.45em 0}
.muted{color:var(--ink2)}
.small{font-size:.85rem}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin:12px 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.btn{border:none;border-radius:14px;padding:14px 20px;background:var(--ink);color:var(--card);font-weight:600;min-height:52px}
.btn.accent{background:var(--accent);color:#fff}
.btn.blue{background:var(--accent2);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.small{min-height:40px;padding:8px 14px;font-size:.9rem;border-radius:12px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.iconbtn{border:none;background:var(--card);box-shadow:var(--shadow);border-radius:12px;width:46px;height:46px;font-size:1.2rem}
.progress{flex:1;height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.progress>div{height:100%;background:var(--accent);border-radius:6px;transition:width .4s}
.tag{display:inline-block;font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:20px;background:var(--soft-blue);color:var(--accent2);letter-spacing:.02em}
.tag.math{background:var(--soft-blue);color:var(--math)}
.tag.pc{background:color-mix(in srgb,var(--pc) 15%,transparent);color:var(--pc)}
.tag.college{background:color-mix(in srgb,var(--college) 18%,transparent);color:var(--college)}
.qtext{font-size:1.2rem;font-weight:500;margin:10px 0 6px}
.choices{display:grid;gap:10px;margin-top:12px}
.choice{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 16px;font-size:1.08rem;min-height:56px;transition:border-color .15s,background .15s}
.choice:active{transform:scale(.99)}
.choice.ok{border-color:var(--ok);background:var(--soft-ok)}
.choice.ko{border-color:var(--ko);background:var(--soft-ko)}
.choice.dim{opacity:.5}
.qfoot{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.qfoot .btn{flex:1}
.fb{border-radius:var(--r);padding:16px 18px;margin-top:14px;animation:pop .25s ease}
.fb.ok{background:var(--soft-ok);border-left:6px solid var(--ok)}
.fb.ko{background:var(--soft-ko);border-left:6px solid var(--ko)}
.fb.info{background:var(--soft-blue);border-left:6px solid var(--accent2)}
.fb h3{margin-top:0}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.lesson-step{animation:pop .3s ease}
.dots{display:flex;gap:6px;justify-content:center;margin:12px 0}
.dots span{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots span.on{background:var(--accent)}
.widget{background:var(--bg);border-radius:14px;padding:12px;margin:12px 0;overflow:hidden}
.widget svg{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none}
.widget .ctrl{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-top:8px;font-size:.95rem}
.widget label{display:flex;align-items:center;gap:8px;flex:1 1 220px}
.widget input[type=range]{flex:1;accent-color:var(--accent);height:32px}
.widget .readout{font-weight:600;font-variant-numeric:tabular-nums;background:var(--card);padding:6px 12px;border-radius:10px}
.widget .wbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.widget .wbtn{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;font-size:.95rem;min-height:44px}
.widget .wbtn.on{border-color:var(--accent);background:var(--soft-acc)}
.widget .cap{font-size:.92rem;color:var(--ink2);margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--card);border-radius:20px;padding:6px 14px;font-size:1rem;min-height:40px}
.chip.on{border-color:var(--accent);background:var(--soft-acc)}
.home-hero{display:flex;gap:16px;align-items:center}
.stat{flex:1;text-align:center;background:var(--card);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:1.6rem}
.subjects{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.subj{border:none;border-radius:var(--r);padding:20px;text-align:left;color:#fff;min-height:110px;box-shadow:var(--shadow)}
.subj b{display:block;font-size:1.25rem}
.subj.math{background:linear-gradient(135deg,#2e6fe4,#4f8cf0)}
.subj.pc{background:linear-gradient(135deg,#7b3fd0,#a06ae8)}
.subj.mix{background:linear-gradient(135deg,#e4572e,#f08a4b)}
.chapter{border-left:5px solid var(--line);padding:6px 0 6px 12px;margin:10px 0}
.chapter.math{border-color:var(--math)}
.chapter.pc{border-color:var(--pc)}
.chapter.college{border-color:var(--college)}
.cpills{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.cpill{border:none;border-radius:20px;padding:6px 12px;font-size:.88rem;background:var(--line);color:var(--ink)}
.cpill.s-new{background:var(--line)}
.cpill.s-learn{background:var(--soft-warn);color:var(--ink);box-shadow:inset 0 0 0 2px var(--warn)}
.cpill.s-weak{background:var(--soft-ko);box-shadow:inset 0 0 0 2px var(--ko)}
.cpill.s-ok{background:var(--soft-ok);box-shadow:inset 0 0 0 2px var(--ok)}
.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:.85rem}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.switch:last-child{border-bottom:none}
.toggle{width:58px;height:34px;border-radius:20px;border:none;background:var(--line);position:relative;flex-shrink:0}
.toggle::after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.toggle.on{background:var(--ok)}
.toggle.on::after{left:28px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:12px 18px;border-radius:14px;z-index:50;animation:pop .2s;max-width:90vw}
textarea{width:100%;min-height:90px;font:inherit;font-size:.8rem;border-radius:12px;border:2px solid var(--line);padding:10px;background:var(--card);color:var(--ink)}
/* mini maths typesetting */
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .12em;font-size:.95em;line-height:1.15}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .15em}
.frac>span:last-child{padding:0 .15em}
.sqrt{white-space:nowrap}
.sqrt>span{border-top:1.5px solid currentColor;padding:0 .1em;margin-left:.05em}
.nuc{display:inline-flex;align-items:center;gap:.08em;vertical-align:middle}
.nuc .az{display:inline-flex;flex-direction:column;text-align:right;font-size:.65em;line-height:1.05}
.m{font-family:"Times New Roman",Georgia,serif;font-style:italic}
.big{font-size:1.25em}
.hl{background:var(--soft-warn);padding:0 .2em;border-radius:4px}
.formula{display:block;text-align:center;font-size:1.25rem;padding:10px;background:var(--card);border-radius:12px;margin:8px 0}
.sum-star{font-size:3rem;text-align:center}
.cause{display:flex;gap:10px;align-items:flex-start}
.cause .ico{font-size:1.6rem}
table.simple{border-collapse:collapse;width:100%;font-size:.95rem}
table.simple td,table.simple th{border:1px solid var(--line);padding:6px 8px;text-align:center}
.ptable{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.pcell{border:2px solid var(--line);border-radius:8px;background:var(--card);padding:4px 2px;text-align:center;font-size:.8rem;min-height:52px;line-height:1.15}
.pcell b{display:block;font-size:1.05rem}
.pcell.on{border-color:var(--accent);background:var(--soft-acc)}
.pcell.empty{visibility:hidden}
.shells{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:6px 0}
.sub{display:flex;flex-direction:column;align-items:center;font-size:.85rem}
.boxes{display:flex;gap:2px}
.boxes i{display:inline-block;width:20px;height:22px;border:1.5px solid var(--ink2);border-radius:3px;font-style:normal;font-size:.75rem;line-height:20px;text-align:center}
.boxes i.f{background:var(--accent);border-color:var(--accent);color:#fff}
@media (max-width:520px){
  html,body{font-size:17px}
  .qtext{font-size:1.1rem}
  .ptable{gap:2px}
  .pcell{font-size:.7rem}
}

.subj.themes{background:linear-gradient(135deg,#1f9d6b,#3cbf8a);width:100%;min-height:84px}
.acc{padding:0;overflow:hidden}
.acc-head{width:100%;display:flex;justify-content:space-between;align-items:center;border:none;padding:18px 20px;font-size:1.25rem;font-weight:700;color:#fff}
.acc-head.math{background:linear-gradient(135deg,#2e6fe4,#4f8cf0)}
.acc-head.pc{background:linear-gradient(135deg,#7b3fd0,#a06ae8)}
.acc-body{padding:6px 14px 12px}
.theme{border-bottom:1px solid var(--line)}
.theme:last-child{border-bottom:none}
.theme-head{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:none;background:none;padding:14px 4px;font-size:1.05rem;font-weight:600;min-height:52px}
.theme.off .theme-head{color:var(--ink2);opacity:.6}
.theme-body{padding:0 4px 14px}
.vec{display:inline-block;position:relative;padding-top:.32em;line-height:1.05}
.vec::before{content:"";position:absolute;left:4%;right:14%;top:.14em;border-top:1.5px solid currentColor}
.vec::after{content:"";position:absolute;right:3%;top:-.04em;border-left:.42em solid currentColor;border-top:.18em solid transparent;border-bottom:.18em solid transparent}
.vt{display:grid;border:1.5px solid var(--ink2);border-radius:10px;overflow:hidden;margin:10px 0;background:var(--card);font-size:1rem}
.vth{padding:6px 10px;font-weight:700;font-style:italic;border-right:1.5px solid var(--ink2);display:flex;align-items:center}
.vtx{padding:6px 2px;text-align:center;border-bottom:1.5px solid var(--ink2)}
.vth.vtx{justify-content:flex-start}
.vtv{height:80px;display:flex;justify-content:center;padding:4px 2px}
.vtv.h{align-items:flex-start}.vtv.l{align-items:flex-end}.vtv.m{align-items:center}
.vta{display:flex;align-items:center;justify-content:center;font-size:1.7rem;color:var(--accent)}
.stc{padding:7px 2px;text-align:center;font-weight:600}
.stb{border-bottom:1px solid var(--line)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:8px;font-size:.95rem;margin:8px 0;text-align:left}
.code div{padding:2px 8px;border-radius:6px;white-space:pre}
.code div.cur{background:var(--soft-warn);box-shadow:inset 3px 0 0 var(--warn)}
.eqline{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;font-size:1.15rem;margin:8px 0}
.eqsp{display:inline-flex;align-items:center;gap:4px;background:var(--card);border-radius:12px;padding:4px 6px}
.eqb{width:36px;height:36px;border-radius:10px;border:2px solid var(--line);background:var(--bg);font-weight:700}
.eqc{min-width:18px;text-align:center;color:var(--accent);font-size:1.25rem}
.eqop{font-weight:700;color:var(--ink2)}

</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* ============ Déclic 2de : moteur ============ */
const APP = { name: 'Déclic 2de', key: 'declic2de.v1' };
const CH = [];          // chapitres
const CO = {};          // notions (concepts)
const WG = {};          // widgets visuels
const chapter = o => CH.push(Object.assign({ bloc: 1, level: '2de' }, o));
const concept = o => { CO[o.id] = Object.assign({ prereq: [], lesson: [], qs: [] }, o); };
const widget = (name, fn) => { WG[name] = fn; };

/* ---------- mise en forme mathématique ---------- */
const F = (a, b) => `<span class="frac"><span>${a}</span><span>${b}</span></span>`;
const R = x => `<span class="sqrt">√<span>${x}</span></span>`;
const NUC = (A, Z, X) => `<span class="nuc"><span class="az"><span>${A}</span><span>${Z}</span></span><span>${X}</span></span>`;
const M = x => `<span class="m">${x}</span>`;
const FX = x => `<span class="formula">${x}</span>`;
function nf(x, d) {
  if (typeof x !== 'number') return String(x);
  let s = d === undefined ? String(+x.toPrecision(12)) : x.toFixed(d);
  if (s.includes('e')) return s;
  const neg = s.startsWith('-'); if (neg) s = s.slice(1);
  let [i, f] = s.split('.');
  if (i.length > 4) i = i.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return (neg ? '−' : '') + i + (f ? ',' + f : '');
}
const sgn = x => (x < 0 ? '− ' + nf(-x) : '+ ' + nf(x));          // « + 3 » / « − 3 »
const par = x => (x < 0 ? '(' + nf(x) + ')' : nf(x));              // parenthèses si négatif

/* ---------- hasard ---------- */
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a; };

/* ---------- dates ---------- */
function today() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function addDays(s, n) { const [y, m, d] = s.split('-').map(Number); const t = new Date(y, m - 1, d + n); return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0'); }
function dayDiff(a, b) { const p = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); }; return Math.round((p(b) - p(a)) / 864e5); }

/* ---------- sauvegarde ---------- */
const INTERVALS = [0, 1, 2, 4, 8, 16, 30];
function freshState() { return { v: 1, created: today(), c: {}, skip: {}, days: {}, lastSubj: 'mix' }; }
function loadState() { try { const s = localStorage.getItem(APP.key); if (s) { const o = JSON.parse(s); if (o && o.v === 1) return o; } } catch (e) { } return freshState(); }
let S = loadState();
let storageOK = true;
function save() { try { localStorage.setItem(APP.key, JSON.stringify(S)); storageOK = true; } catch (e) { storageOK = false; } }
function rec(id) { return S.c[id] || (S.c[id] = { b: 0, d: null, n: 0, ok: 0, ko: 0, l: null, qi: [] }); }
function status(id) { const r = S.c[id]; if (!r || !r.n) return 'new'; if (r.b >= 3) return 'ok'; if (r.b === 0) return 'weak'; return 'learn'; }
const STATUS_LABEL = { new: 'pas encore vue', learn: 'en cours', weak: 'à retravailler', ok: 'maîtrisée' };
function recentlyMastered(id) { const r = S.c[id]; return !!(r && r.b >= 2 && r.l && dayDiff(r.l, today()) <= 21); }
function markResult(id, ok) {
  const r = rec(id), t = today();
  r.n++; r.l = t;
  if (ok) { r.ok++; r.b = Math.min(r.b + 1, INTERVALS.length - 1); } else { r.ko++; r.b = 0; }
  r.d = addDays(t, ok ? INTERVALS[r.b] : 1);
  const d = S.days[t] || (S.days[t] = { n: 0, ok: 0 }); d.n++; if (ok) d.ok++;
  save();
}
function streak() {
  let t = today(), n = 0;
  if (!(S.days[t] && S.days[t].n)) t = addDays(t, -1);
  while (S.days[t] && S.days[t].n) { n++; t = addDays(t, -1); }
  return n;
}
const chOf = cid => CH.find(c => c.id === CO[cid].ch);
const subjOf = cid => chOf(cid).subj;
const isCollege = cid => chOf(cid).level === 'college';
const skippedConcept = cid => !!S.skip[CO[cid].ch];
const title = cid => CO[cid].title;
function chapterReady(ch) { return Object.values(CO).some(c => c.ch === ch.id && c.qs.length); }
function conceptsOf(chId) { return Object.values(CO).filter(c => c.ch === chId); }

/* ---------- DOM ---------- */
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (k === 'class') e.className = v; else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'style') e.style.cssText = v; else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
const NS = 'http://www.w3.org/2000/svg';
function sv(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) {
    const v = attrs[k];
    if (k === 'text') e.textContent = v;
    else if ((k === 'fill' || k === 'stroke') && String(v).includes('var(')) e.style[k] = v;
    else e.setAttribute(k, v);
  }
  if (parent) parent.appendChild(e);
  return e;
}
function svgRoot(w, hgt, parent) { return sv('svg', { viewBox: `0 0 ${w} ${hgt}`, 'font-family': 'inherit' }, parent); }
function slider(ctrl, label, min, max, step, val, onInput, fmt) {
  const out = h('span', { class: 'readout' });
  const inp = h('input', { type: 'range', min, max, step, value: val });
  const upd = () => { out.innerHTML = fmt ? fmt(+inp.value) : nf(+inp.value); onInput(+inp.value); };
  inp.addEventListener('input', upd);
  ctrl.append(h('label', null, h('span', { html: label }), inp, out));
  setTimeout(upd, 0);
  return inp;
}
function wbtns(parent, items, onPick, initial) {
  const box = h('div', { class: 'wbtns' });
  const bs = items.map((it, i) => { const b = h('button', { class: 'wbtn' + (i === (initial || 0) ? ' on' : ''), html: it, onclick: () => { bs.forEach(x => x.classList.remove('on')); b.classList.add('on'); onPick(i); } }); box.append(b); return b; });
  parent.append(box);
  return bs;
}
let CLEANUPS = [], MARK = 0;
// arrête les animations de l’écran précédent, garde celles créées pour le nouvel écran
function cleanup() { const old = CLEANUPS.slice(0, MARK); CLEANUPS = CLEANUPS.slice(MARK); old.forEach(f => { try { f(); } catch (e) { } }); MARK = CLEANUPS.length; }
function onFrame(fn) { let id, alive = true; const loop = t => { if (!alive) return; fn(t); id = requestAnimationFrame(loop); }; id = requestAnimationFrame(loop); CLEANUPS.push(() => { alive = false; cancelAnimationFrame(id); }); }
function renderWidget(spec) {
  const box = h('div', { class: 'widget' });
  const fn = WG[spec.type];
  if (!fn) { box.textContent = '[visuel manquant : ' + spec.type + ']'; return box; }
  try { fn(box, spec); } catch (e) { console.error(e); box.textContent = 'Erreur dans le visuel.'; }
  return box;
}
function toast(msg) { const t = h('div', { class: 'toast', html: msg }); document.body.append(t); setTimeout(() => t.remove(), 2800); }
const app = () => document.getElementById('app');
function screen(...nodes) { cleanup(); const a = app(); a.innerHTML = ''; a.append(...nodes.filter(Boolean)); window.scrollTo(0, 0); }

/* ---------- questions ---------- */
function buildQ(cid) {
  const c = CO[cid], r = rec(cid);
  let idxs = c.qs.map((_, i) => i).filter(i => !r.qi.includes(i));
  if (!idxs.length) idxs = c.qs.map((_, i) => i);
  const i = pick(idxs);
  r.qi = [i].concat(r.qi).slice(0, Math.min(2, c.qs.length - 1));
  const raw = c.qs[i];
  const q = typeof raw === 'function' ? raw() : raw;
  const choices = q.keep ? q.c.slice() : shuffle(q.c);
  return Object.assign({}, q, { c: choices });
}

/* ---------- séance ---------- */
let SES = null, CUR = null;
function startSession(subj, focus, pool, back) {
  SES = { subj, target: pool ? (pool.length === 1 ? 5 : 8) : 10, answered: 0, correct: 0, stack: [], asked: new Set(), worked: new Set(), lessons: 0, alt: 0, pool: pool || null, cnt: {}, last: null, back: back || null };
  S.lastSubj = subj; save();
  if (focus) ask(focus, 'normal'); else nextTask();
}
function candidatesFor(subj) {
  const t = today(), avail = cid => !skippedConcept(cid) && !SES.asked.has(cid) && CO[cid].qs.length && subjOf(cid) === subj;
  const all = Object.keys(CO).filter(avail);
  const due = all.filter(id => S.c[id] && S.c[id].n && S.c[id].d <= t).sort((a, b) => (S.c[a].d < S.c[b].d ? -1 : S.c[a].d > S.c[b].d ? 1 : S.c[a].b - S.c[b].b));
  const order = CH.filter(c => c.subj === subj && c.level === '2de');
  let fresh = null;
  for (const ch of order) { if (S.skip[ch.id]) continue; const f = Object.keys(CO).find(id => CO[id].ch === ch.id && avail(id) && !(S.c[id] && S.c[id].n)); if (f) { fresh = f; break; } }
  const weak = all.filter(id => S.c[id] && S.c[id].n && !isCollege(id)).sort((a, b) => S.c[a].b - S.c[b].b || (S.c[a].l < S.c[b].l ? -1 : 1));
  return { due, fresh, weak };
}
function chooseConcept() {
  if (SES.pool) {
    const t = today();
    let ids = SES.pool.filter(id => CO[id] && CO[id].qs.length);
    if (ids.length > 1) ids = ids.filter(id => id !== SES.last);
    const score = id => { const r = S.c[id]; return (SES.cnt[id] || 0) * 100 + (!r || !r.n ? 0 : r.d <= t ? 10 + r.b : 20 + r.b) + Math.random(); };
    return ids.sort((a, b) => score(a) - score(b))[0] || null;
  }
  const subs = SES.subj === 'mix' ? (SES.alt++ % 2 ? ['pc', 'math'] : ['math', 'pc']) : [SES.subj];
  for (const s of subs) {
    const { due, fresh, weak } = candidatesFor(s);
    const preferNew = SES.answered % 2 === 1;
    if (preferNew && fresh) return fresh;
    if (due.length) return due[0];
    if (fresh) return fresh;
    if (weak.length && S.c[weak[0]].b < 3) return weak[0];
  }
  return null;
}
function nextTask() {
  if (SES.answered >= SES.target && !SES.stack.length) return summary();
  const cid = chooseConcept();
  if (!cid) return summary(true);
  ask(cid, 'normal');
}
function topBar(extra) {
  const pct = SES ? Math.min(100, Math.round(100 * SES.answered / SES.target)) : 0;
  return h('div', { class: 'topbar' },
    h('button', { class: 'iconbtn', 'aria-label': 'Accueil', onclick: () => { if (!SES || SES.answered === 0 || confirm('Arrêter la séance ? Ta progression est déjà enregistrée.')) home(); } }, '⌂'),
    h('div', { class: 'progress' }, h('div', { style: `width:${pct}%` })), extra || null);
}
function subjTag(cid) {
  const ch = chOf(cid); const cls = ch.level === 'college' ? 'college' : ch.subj;
  const lab = ch.level === 'college' ? 'Bases du collège' : (ch.subj === 'math' ? 'Maths' : 'Physique-chimie');
  return h('span', { class: 'tag ' + cls }, lab + ' · ' + CO[cid].title);
}
function ask(cid, mode, pre) {
  SES.asked.add(cid); SES.worked.add(cid);
  SES.cnt[cid] = (SES.cnt[cid] || 0) + 1; if (mode === 'normal') SES.last = cid;
  const q = buildQ(cid);
  CUR = { cid, mode, q };
  const card = h('div', { class: 'card' });
  if (pre) card.append(h('div', { class: 'fb info', html: pre }));
  card.append(subjTag(cid), h('div', { class: 'qtext', html: q.q }));
  if (q.w) card.append(renderWidget(q.w));
  const choices = h('div', { class: 'choices' });
  const btns = q.c.map((c, i) => h('button', { class: 'choice', html: c.t, onclick: () => answer(i) }));
  choices.append(...btns);
  card.append(choices);
  const foot = h('div', { class: 'qfoot' });
  foot.append(h('button', { class: 'btn ghost', onclick: () => answer('idk') }, 'Je ne sais pas'));
  if (mode === 'normal' && !isCollege(cid) && !SES.pool) foot.append(h('button', { class: 'btn ghost', onclick: notYet }, 'Pas encore vu en classe'));
  card.append(foot);
  CUR.btns = btns; CUR.foot = foot; CUR.card = card;
  screen(topBar(), card);
}
function notYet() {
  const ch = chOf(CUR.cid);
  S.skip[ch.id] = true; save();
  toast(`Chapitre « ${ch.title} » mis de côté. Tu pourras le réactiver dans Réglages.`);
  SES.asked.add(CUR.cid);
  nextTask();
}
function firstWeakPrereq(cid) { return (CO[cid].prereq || []).find(p => CO[p] && !recentlyMastered(p) && !skippedConcept(p)); }
function answer(i) {
  if (CUR.done) return; CUR.done = true;
  const { cid, mode, q } = CUR;
  const idk = i === 'idk';
  const ch = idk ? null : q.c[i];
  const ok = !!(ch && ch.ok);
  markResult(cid, ok);
  SES.answered++; if (ok) SES.correct++;
  CUR.btns.forEach((b, j) => { b.disabled = true; if (q.c[j].ok) b.classList.add('ok'); else if (j === i) b.classList.add('ko'); else b.classList.add('dim'); });
  CUR.foot.remove();
  const next = decide(ok, ch, idk);
  const fb = h('div', { class: 'fb ' + (ok ? 'ok' : 'ko') });
  if (ok) {
    fb.append(h('h3', null, pick(['Bravo !', 'Exact !', 'Bien joué !', 'C’est ça !'])));
    if (q.exp) fb.append(h('p', { html: q.exp }));
  } else {
    fb.append(h('h3', null, idk ? 'Pas de souci, on va regarder ça ensemble.' : 'Pas tout à fait.'));
    if (ch && ch.why) fb.append(h('p', { html: ch.why }));
    const good = q.c.find(c => c.ok);
    fb.append(h('p', { html: 'La bonne réponse : <b>' + good.t + '</b>' }));
    if (q.exp) fb.append(h('p', { class: 'muted', html: q.exp }));
  }
  if (next.msg) fb.append(h('div', { class: 'cause' }, h('span', { class: 'ico' }, next.ico || '🔎'), h('p', { html: next.msg })));
  fb.append(h('button', { class: 'btn accent wide', style: 'margin-top:10px', onclick: () => go(next) }, next.label || 'Continuer'));
  CUR.card.append(fb);
  fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
function decide(ok, ch, idk) {
  const { cid, mode } = CUR, st = SES.stack;
  if (ok) {
    if (mode === 'diag') {
      const parent = st.pop();
      return { type: 'lesson', cid: parent, ico: '💡', msg: `Cette base est acquise. La difficulté est donc dans « ${title(parent)} » : je te l’explique en images.`, label: 'Voir l’explication' };
    }
    if ((mode === 'after' || mode === 'retry') && st.length) {
      const parent = st.pop();
      return { type: 'ask', cid: parent, mode: 'retry', ico: '↩️', msg: `« ${title(cid)} » est réglé. Revenons à « ${title(parent)} ».` };
    }
    return { type: 'next' };
  }
  if (mode === 'after') {
    SES.stack = [];
    return { type: 'next', ico: '📅', msg: 'Ce n’est pas grave : cette notion reviendra demain, et la leçon reste disponible dans « Ma carte ».' };
  }
  if (mode === 'retry') return { type: 'lesson', cid, ico: '💡', msg: 'Regardons maintenant cette notion elle-même, en images.', label: 'Voir l’explication' };
  let cause = idk ? firstWeakPrereq(cid) : (ch && ch.cause);
  if (cause && cause !== cid && CO[cause] && CO[cause].qs.length && st.length < 3 && !st.includes(cause) && !recentlyMastered(cause) && !skippedConcept(cause)) {
    st.push(cid);
    return { type: 'ask', cid: cause, mode: 'diag', msg: `Ce type d’erreur vient souvent d’une base : <b>${title(cause)}</b>. Vérifions-la avec une question rapide.` };
  }
  return { type: 'lesson', cid, ico: '💡', msg: 'Je t’explique cette notion en images.', label: 'Voir l’explication' };
}
function go(n) {
  if (n.type === 'next') return nextTask();
  if (n.type === 'ask') return ask(n.cid, n.mode, n.pre);
  if (n.type === 'lesson') return lesson(n.cid, () => ask(n.cid, 'after', 'À toi : une question pour vérifier.'));
}

/* ---------- leçon ---------- */
function lesson(cid, done, fromMap) {
  const c = CO[cid]; let k = 0;
  if (SES && !fromMap) SES.lessons++;
  rec(cid).ls = today(); save();
  const show = () => {
    const st = c.lesson[k];
    const card = h('div', { class: 'card lesson-step' });
    card.append(subjTag(cid));
    if (st.h) card.append(h('h2', { html: st.h }));
    if (st.t) card.append(h('div', { html: st.t }));
    if (st.w) card.append(renderWidget(st.w));
    if (st.t2) card.append(h('div', { html: st.t2 }));
    const dots = h('div', { class: 'dots' }, c.lesson.map((_, i) => h('span', { class: i === k ? 'on' : '' })));
    const nav = h('div', { class: 'row' });
    if (k > 0) nav.append(h('button', { class: 'btn ghost', onclick: () => { k--; show(); } }, '← Retour'));
    nav.append(h('div', { class: 'spacer' }));
    if (k < c.lesson.length - 1) nav.append(h('button', { class: 'btn accent', onclick: () => { k++; show(); } }, 'Suivant →'));
    else nav.append(h('button', { class: 'btn accent', onclick: done }, fromMap ? 'Terminé' : 'J’ai compris → question'));
    screen(fromMap ? h('div', { class: 'topbar' }, h('button', { class: 'iconbtn', onclick: done }, '←'), h('b', null, 'Leçon')) : topBar(), card, dots, nav);
  };
  show();
}

/* ---------- bilan ---------- */

  const n = SES.answered, ok = SES.correct;

  card.append(h('div', { class: 'sum-star' }, n === 0 ? '🌱' : ok / Math.max(n, 1) >= .7 ? '🌟' : '💪'));

  if (n) card.append(h('p', { style: 'text-align:center', html: `${ok} bonne${ok > 1 ? 's' : ''} réponse${ok > 1 ? 's' : ''} sur ${n} · ${SES.lessons} explication${SES.lessons > 1 ? 's' : ''} vue${SES.lessons > 1 ? 's' : ''}` }));
  if (empty) card.append(h('p', { class: 'muted', style: 'text-align:center' }, 'Il n’y a plus de nouvelle notion disponible pour cette matière aujourd’hui. Réactive des chapitres dans Réglages ou reviens demain pour les révisions.'));
  const list = h('div', { class: 'cpills', style: 'justify-content:center;margin:12px 0' });
  SES.worked.forEach(id => list.append(h('span', { class: 'cpill s-' + ({ new: 'new', learn: 'learn', weak: 'weak', ok: 'ok' })[status(id)] }, CO[id].title)));

  card.append(h('p', { class: 'small muted', style: 'text-align:center' }, 'Les notions ratées reviendront demain, les autres un peu plus tard : c’est en revoyant régulièrement qu’on retient.'));
  const row = h('div', { class: 'row' });

  if (!empty) row.append(h('button', { class: 'btn ghost', style: 'flex:1', onclick: () => { SES = ses; SES.target = SES.answered + 5; nextTask(); } }, 'Encore 5 questions'));
  if (ses.back) row.append(h('button', { class: 'btn ghost', style: 'flex:1', onclick: ses.back }, 'Retour aux thèmes'));
  row.append(h('button', { class: 'btn accent', style: 'flex:1', onclick: home }, 'Accueil'));

}

/* ---------- réviser par thème ---------- */
let THEME_OPEN = { subj: null, ch: null };
function themes() {
  const back = () => themes();
  const body = h('div');
  for (const [subj, lab] of [['math', 'Maths'], ['pc', 'Physique-chimie']]) {
    const isOpen = THEME_OPEN.subj === subj;

    head.onclick = () => { const show = list.style.display === 'none'; list.style.display = show ? '' : 'none'; chev.textContent = show ? '▾' : '▸'; THEME_OPEN.subj = show ? subj : null; };
    CH.filter(c => c.subj === subj && c.level === '2de').forEach(ch => list.append(themeRow(ch, back)));
    body.append(h('div', { class: 'card acc' }, head, list));
  }
  screen(h('div', { class: 'topbar' }, h('button', { class: 'iconbtn', onclick: home }, '⌂'), h('h1', null, 'Réviser par thème')),
    h('p', { class: 'muted' }, 'Choisis la matière, puis le chapitre que tu travailles en classe. Tu peux réviser tout le chapitre ou une seule notion.'), body);
}
function themeRow(ch, back) {

  if (ready) {
    const isOpen = THEME_OPEN.ch === ch.id;
    const inner = h('div', { class: 'theme-body', style: isOpen ? '' : 'display:none' },
      h('button', { class: 'btn accent wide', onclick: () => startChapter(ch, back) }, '▶ Tout le chapitre'),

    CH.filter(c => c.subj === subj && c.level === '2de' && chapterReady(c)).forEach(ch => {
      const tg = h('button', { class: 'toggle' + (S.skip[ch.id] ? '' : ' on'), 'aria-label': ch.title });
      tg.onclick = () => { if (S.skip[ch.id]) delete S.skip[ch.id]; else S.skip[ch.id] = true; save(); tg.classList.toggle('on', !S.skip[ch.id]); };
      chs.append(h('div', { class: 'switch' }, h('span', null, ch.title), tg));
    });
  }
  const code = h('textarea', { readonly: true });
  const backup = h('div', { class: 'card' }, h('h2', null, 'Sauvegarde'),
    h('p', { class: 'small muted' }, 'Ta progression est enregistrée sur cet appareil. Pour la mettre à l’abri ou la transférer, copie le code de sauvegarde et garde-le (dans Notes, par exemple).'),
    h('div', { class: 'row' },
      h('button', { class: 'btn small ghost', onclick: () => { code.value = btoa(unescape(encodeURIComponent(JSON.stringify(S)))); code.select(); try { navigator.clipboard.writeText(code.value); toast('Code copié.'); } catch (e) { } } }, 'Créer le code'),
      h('button', { class: 'btn small ghost', onclick: () => { const v = prompt('Colle ici ton code de sauvegarde :'); if (!v) return; try { const o = JSON.parse(decodeURIComponent(escape(atob(v.trim())))); if (o.v !== 1) throw 0; S = o; save(); toast('Progression restaurée.'); home(); } catch (e) { alert('Code invalide.'); } } }, 'Restaurer un code'),
      h('button', { class: 'btn small ghost', onclick: () => { if (confirm('Effacer toute la progression ?') && confirm('Vraiment ? C’est définitif.')) { S = freshState(); save(); home(); } } }, 'Tout effacer')),
    code);
  const install = h('div', { class: 'card' }, h('h2', null, 'Installer sur l’iPad'),
    h('p', { html: 'Dans Safari, touche le bouton <b>Partager</b> (le carré avec une flèche), puis <b>Sur l’écran d’accueil</b>. L’application s’ouvrira alors en plein écran, et ta progression sera mieux conservée.' }));
  const about = h('div', { class: 'card small muted', html: 'Programmes suivis : mathématiques de seconde générale et technologique (arrêté du 26-2-2026, BO n° 14 du 2 avril 2026, en vigueur à la rentrée 2026) ; physique-chimie de seconde générale et technologique (arrêté du 17-1-2019, BO spécial n° 1 du 22 janvier 2019).' });
  screen(h('div', { class: 'topbar' }, h('button', { class: 'iconbtn', onclick: home }, '⌂'), h('h1', null, 'Réglages')), chs, backup, install, about);
}
function help() {
  const c = h('div', { class: 'card', html: `
  <h2>Comment ça marche ?</h2>
  <p>1. Choisis une séance. Tu réponds à une dizaine de questions courtes.</p>
  <p>2. Si tu te trompes, l’application cherche <b>d’où vient l’erreur</b> : souvent une base plus ancienne. Elle te pose une question rapide sur cette base pour vérifier.</p>
  <p>3. Elle t’explique alors la notion qui coince <b>avec des images et des animations</b> que tu peux manipuler, puis te repose une question.</p>
  <p>4. Les notions reviennent les jours suivants pour être révisées : le lendemain si tu t’es trompée, puis de plus en plus espacées quand tu réussis.</p>
  <p><b>Je ne sais pas</b> : mieux vaut le dire que deviner, l’application t’aide aussitôt.</p>
  <p><b>Pas encore vu en classe</b> : le chapitre est mis de côté jusqu’à ce que tu le réactives dans Réglages.</p>
  <p><b>Ma carte</b> montre toutes les notions et leur état. Touche une notion pour revoir la leçon ou t’entraîner.</p>` });
  screen(h('div', { class: 'topbar' }, h('button', { class: 'iconbtn', onclick: home }, '⌂'), h('h1', null, 'Mode d’emploi')), c);
}
window.addEventListener('DOMContentLoaded', home);

</script>
<script>
'use strict';
/* ============ Visuels : maths ============ */
const C = { ink: 'var(--ink)', ink2: 'var(--ink2)', line: 'var(--line)', acc: 'var(--accent)', blue: 'var(--accent2)', ok: 'var(--ok)', ko: 'var(--ko)', warn: 'var(--warn)', card: 'var(--card)', pc: 'var(--pc)' };

/* axe gradué générique */
function drawAxis(g, { x0 = 30, x1 = 570, y = 70, min, max, step = 1, labels = true, labelEvery = 1 }) {
  const X = v => x0 + (v - min) * (x1 - x0) / (max - min);
  sv('line', { x1: x0 - 12, y1: y, x2: x1 + 12, y2: y, stroke: C.ink, 'stroke-width': 2 }, g);
  sv('path', { d: `M${x1 + 18} ${y} l-10 -6 v12 z`, fill: C.ink }, g);
  let k = 0;
  for (let v = min; v <= max + 1e-9; v += step, k++) {
    const vv = +v.toFixed(6);
    sv('line', { x1: X(vv), y1: y - 6, x2: X(vv), y2: y + 6, stroke: C.ink, 'stroke-width': vv === 0 ? 2.5 : 1.5 }, g);
    if (labels && k % labelEvery === 0) sv('text', { x: X(vv), y: y + 26, 'text-anchor': 'middle', 'font-size': 16, fill: C.ink2, text: nf(vv) }, g);
  }
  return X;
}

/* ---------- droite numérique : intervalles / inéquations ---------- */
// presets : [{a, b, ca, cb, label}] a/b peuvent être ±Infinity ; ca/cb : bornes fermées
widget('numline', (el, o) => {
  const min = o.min ?? -5, max = o.max ?? 5;
  const svg = svgRoot(600, 120, el);
  const g = sv('g', {}, svg);
  const X = drawAxis(g, { min, max, step: o.step || 1, labelEvery: o.labelEvery || 1 });
  const layer = sv('g', {}, svg);
  const ctrl = h('div', { class: 'ctrl' });
  const info = h('div', { class: 'cap' });
  let cur = o.presets[0], x = o.x ?? 0;
  const inI = v => (cur.a === -Infinity || (cur.ca ? v >= cur.a : v > cur.a)) && (cur.b === Infinity || (cur.cb ? v <= cur.b : v < cur.b));
  const draw = () => {
    layer.innerHTML = '';
    const xa = cur.a === -Infinity ? 18 : X(cur.a), xb = cur.b === Infinity ? 582 : X(cur.b);
    sv('line', { x1: xa, y1: 70, x2: xb, y2: 70, stroke: C.acc, 'stroke-width': 8, 'stroke-linecap': 'butt', opacity: .8 }, layer);
    const br = (xv, closed, left) => sv('text', { x: xv, y: 82, 'text-anchor': 'middle', 'font-size': 40, 'font-weight': 700, fill: C.acc, text: (left ? (closed ? '[' : ']') : (closed ? ']' : '[')) }, layer);
    if (cur.a !== -Infinity) br(X(cur.a) + (cur.ca ? 4 : -4), cur.ca, true);
    if (cur.b !== Infinity) br(X(cur.b) + (cur.cb ? -4 : 4), cur.cb, false);
    if (o.point !== false) {
      const ok = inI(x);
      sv('circle', { cx: X(x), cy: 38, r: 9, fill: ok ? C.ok : C.ko }, layer);
      sv('line', { x1: X(x), y1: 47, x2: X(x), y2: 64, stroke: ok ? C.ok : C.ko, 'stroke-width': 2 }, layer);
      sv('text', { x: X(x), y: 22, 'text-anchor': 'middle', 'font-size': 15, fill: C.ink, text: 'x = ' + nf(x) }, layer);
      info.innerHTML = `${M('x')} = ${nf(x)} : ${ok ? '<b style="color:var(--ok)">appartient</b> à' : '<b style="color:var(--ko)">n’appartient pas</b> à'} ${cur.label}` + (cur.note ? '<br>' + cur.note : '');
    } else info.innerHTML = cur.label + (cur.note ? '<br>' + cur.note : '');
  };
  if (o.presets.length > 1) wbtns(el, o.presets.map(p => p.label), i => { cur = o.presets[i]; draw(); });
  if (o.point !== false) slider(ctrl, 'Déplace x', min, max, o.xstep || 0.5, x, v => { x = v; draw(); });
  el.append(ctrl, info);
  draw();
});

/* ---------- addition de relatifs : flèches ---------- */
widget('reladd', (el, o) => {
  const svg = svgRoot(600, 120, el);
  const X = drawAxis(sv('g', {}, svg), { min: -10, max: 10, step: 1, labelEvery: 2 });
  const layer = sv('g', {}, svg);
  const ctrl = h('div', { class: 'ctrl' }), cap = h('div', { class: 'cap' });
  let a = o.a ?? 3, b = o.b ?? -5;
  const draw = () => {
    layer.innerHTML = '';
    const s = a + b;
    sv('path', { d: `M${X(0)} 52 L${X(a)} 52`, stroke: C.blue, 'stroke-width': 4 }, layer);
    sv('path', { d: `M${X(a)} 52 l${a >= 0 ? -8 : 8} -6 v12 z`, fill: C.blue }, layer);
    sv('path', { d: `M${X(a)} 34 L${X(s)} 34`, stroke: C.acc, 'stroke-width': 4 }, layer);
    if (b !== 0) sv('path', { d: `M${X(s)} 34 l${b >= 0 ? -8 : 8} -6 v12 z`, fill: C.acc }, layer);
    sv('circle', { cx: X(s), cy: 70, r: 8, fill: C.acc }, layer);
    cap.innerHTML = `On part de 0, on avance de <b style="color:var(--accent2)">${nf(a)}</b>, puis de <b style="color:var(--accent)">${nf(b)}</b> : on arrive à <b>${nf(s)}</b>.<br>${nf(a)} + ${par(b)} = ${nf(s)}` + (b < 0 ? ` (ajouter ${nf(b)}, c’est reculer de ${nf(-b)})` : '');
  };
  slider(ctrl, 'Premier nombre', -10, 10, 1, a, v => { a = v; if (a + b > 10) b = 10 - a; if (a + b < -10) b = -10 - a; draw(); });
  slider(ctrl, 'On ajoute', -10, 10, 1, b, v => { b = Math.max(-10 - a, Math.min(10 - a, v)); draw(); });
  el.append(ctrl, cap); draw();
});

/* ---------- valeur absolue = distance ---------- */
widget('absdist', (el, o) => {
  const svg = svgRoot(600, 130, el);
  const X = drawAxis(sv('g', {}, svg), { y: 80, min: -8, max: 8, step: 1, labelEvery: 2 });
  const layer = sv('g', {}, svg);
  const ctrl = h('div', { class: 'ctrl' }), cap = h('div', { class: 'cap' });
  let a = o.a ?? -3, b = o.b ?? 4;
  const draw = () => {
    layer.innerHTML = '';
    const lo = Math.min(a, b), hi = Math.max(a, b);
    sv('line', { x1: X(lo), y1: 50, x2: X(hi), y2: 50, stroke: C.acc, 'stroke-width': 3 }, layer);
    sv('line', { x1: X(lo), y1: 42, x2: X(lo), y2: 58, stroke: C.acc, 'stroke-width': 3 }, layer);
    sv('line', { x1: X(hi), y1: 42, x2: X(hi), y2: 58, stroke: C.acc, 'stroke-width': 3 }, layer);
    sv('text', { x: (X(lo) + X(hi)) / 2, y: 36, 'text-anchor': 'middle', 'font-size': 16, fill: C.acc, 'font-weight': 700, text: 'distance = ' + nf(hi - lo) }, layer);
    sv('circle', { cx: X(a), cy: 80, r: 8, fill: C.blue }, layer);
    sv('circle', { cx: X(b), cy: 80, r: 8, fill: C.ok }, layer);
    cap.innerHTML = o.zero ? `La distance entre ${nf(a)} et 0 est ${nf(Math.abs(a))} : |${nf(a)}| = ${nf(Math.abs(a))}.` :
      `Distance entre <b style="color:var(--accent2)">a = ${nf(a)}</b> et <b style="color:var(--ok)">b = ${nf(b)}</b> : |a − b| = |${nf(a)} − ${par(b)}| = |${nf(a - b)}| = <b>${nf(Math.abs(a - b))}</b>`;
  };
  slider(ctrl, 'a', -8, 8, 1, a, v => { a = v; draw(); });
  if (o.zero) { b = 0; } else slider(ctrl, 'b', -8, 8, 1, b, v => { b = v; draw(); });
  el.append(ctrl, cap); draw();
});

/* ---------- ensembles de nombres ---------- */
widget('sets', (el, o) => {
  const svg = svgRoot(600, 300, el);
  const sets = [['R', 'ℝ réels', 10, 10, 580, 280], ['Q', 'ℚ rationnels', 30, 45, 500, 235], ['D', '𝔻 décimaux', 50, 80, 400, 190], ['Z', 'ℤ entiers relatifs', 70, 115, 290, 145], ['N', 'ℕ naturels', 90, 150, 160, 100]];
  const cols = [C.ink2, C.pc, C.blue, C.ok, C.acc];
  sets.forEach(([k, lab, x, y, w, hh], i) => {
    sv('rect', { x, y, width: w, height: hh, rx: 18, fill: C.card, 'fill-opacity': .0001, stroke: cols[i], 'stroke-width': 2.5 }, svg);
    sv('text', { x: x + 12, y: y + 22, 'font-size': 15, 'font-weight': 700, fill: cols[i], text: lab }, svg);
  });
  const dot = sv('g', {}, svg);
  const cap = h('div', { class: 'cap', html: 'Touche un nombre pour voir dans quel ensemble il se range.' });
  const items = o.items || [
    ['7', 'N', '7 est un entier naturel : il est donc aussi dans ℤ, 𝔻, ℚ et ℝ.'],
    ['−3', 'Z', '−3 est un entier, mais négatif : il est dans ℤ, pas dans ℕ.'],
    ['0,25', 'D', '0,25 = 25/100 : un nombre décimal (un nombre fini de chiffres après la virgule).'],
    [F(1, 3), 'Q', '1/3 = 0,333… : les 3 ne s’arrêtent jamais, donc 1/3 n’est pas décimal. C’est un quotient d’entiers : il est rationnel.'],
    [F(12, 4), 'N', '12/4 = 3 : sous son écriture fractionnaire se cache un entier naturel !'],
    [R(2), 'R', '√2 ne peut pas s’écrire comme un quotient d’entiers : c’est un irrationnel. Il est seulement dans ℝ.'],
    ['π', 'R', 'π est irrationnel : il est dans ℝ mais pas dans ℚ.'],
    [F('−7', 2), 'D','−7/2 = −3,5 : c’est un décimal.']];
  const chips = h('div', { class: 'chips', style: 'margin-top:8px' });
  items.forEach(([lab, k, why]) => {
    const b = h('button', { class: 'chip', html: lab, onclick: () => {
      chips.querySelectorAll('.chip').forEach(c => c.classList.remove('on')); b.classList.add('on');
      dot.innerHTML = '';
      const rx = sets.find(s => s[0] === k); const nx = sets[sets.indexOf(rx) + 1];
      const cx = nx ? (nx[2] + nx[4] + rx[2] + rx[4]) / 2 : rx[2] + rx[4] / 2, cy = nx ? rx[3] + rx[5] / 2 + 10 : rx[3] + rx[5] / 2 + 10;
      sv('circle', { cx, cy, r: 26, fill: C.acc, opacity: .9 }, dot);
      const fo = sv('foreignObject', { x: cx - 26, y: cy - 16, width: 52, height: 34 }, dot);
      fo.innerHTML = `<div xmlns="http://www.w3.org/1999/xhtml" style="color:#fff;font-weight:700;text-align:center;font-size:15px">${lab}</div>`;
      cap.innerHTML = why;
    } });
    chips.append(b);
  });
  el.append(chips, cap);
});

/* ---------- barres de fractions ---------- */
widget('fracbar', (el, o) => {
  const mode = o.mode || 'simplify';
  const svg = svgRoot(600, mode === 'mul' ? 260 : 170, el);
  const g = sv('g', {}, svg);
  const ctrl = h('div', { class: 'ctrl' }), cap = h('div', { class: 'cap' });
  const bar = (y, n, k, col, lab) => {
    const w = 500 / n;
    for (let i = 0; i < n; i++) sv('rect', { x: 60 + i * w, y, width: w, height: 40, fill: i < k ? col : C.card, stroke: C.ink, 'stroke-width': 1.5 }, g);
    sv('text', { x: 30, y: y + 27, 'text-anchor': 'middle', 'font-size': 18, 'font-weight': 700, fill: C.ink, text: lab }, g);
  };
  if (mode === 'simplify') {
    let a = o.a || 6, b = o.b || 8;
    const draw = (k) => {
      g.innerHTML = '';
      bar(20, b, a, C.blue, `${a}/${b}`);
      if (a % k === 0 && b % k === 0) {
        bar(100, b / k, a / k, C.acc, `${a / k}/${b / k}`);
        cap.innerHTML = `On regroupe les parts par ${k} : ${F(a, b)} = ${F(a + '÷' + k, b + '÷' + k)} = ${F(a / k, b / k)}. La part colorée a <b>la même longueur</b> : c’est le même nombre.`;
      } else cap.innerHTML = `On ne peut pas regrouper ${a} parts et ${b} parts par paquets de ${k} : ${k} ne divise pas les deux nombres.`;
    };
    slider(ctrl, 'Regrouper par', 1, 6, 1, 1, draw);
  } else if (mode === 'add') {
    const [a, b, c, d] = o.f || [1, 2, 1, 3];
    const den = b * d / gcd(b, d);
    let step = 0;
    const draw = () => {
      g.innerHTML = '';
      if (step === 0) { bar(20, b, a, C.blue, `${a}/${b}`); bar(100, d, c, C.acc, `${c}/${d}`); cap.innerHTML = `Les parts n’ont pas la même taille : on ne peut pas encore additionner. Il faut un <b>dénominateur commun</b>.`; }
      else if (step === 1) { bar(20, den, a * den / b, C.blue, `${a * den / b}/${den}`); bar(100, den, c * den / d, C.acc, `${c * den / d}/${den}`); cap.innerHTML = `On découpe tout en ${den} parts égales : ${F(a, b)} = ${F(a * den / b, den)} et ${F(c, d)} = ${F(c * den / d, den)}.`; }
      else { const n1 = a * den / b, n2 = c * den / d; for (let i = 0; i < den; i++) sv('rect', { x: 60 + i * 500 / den, y: 60, width: 500 / den, height: 40, fill: i < n1 ? C.blue : i < n1 + n2 ? C.acc : C.card, stroke: C.ink, 'stroke-width': 1.5 }, g); cap.innerHTML = `Maintenant on additionne les parts : ${F(n1, den)} + ${F(n2, den)} = ${F(n1 + n2, den)}. On additionne les <b>numérateurs</b>, le dénominateur ne change pas.`; }
    };
    wbtns(el, ['1. Les deux fractions', '2. Même découpage', '3. On additionne'], i => { step = i; draw(); });
    draw();
  } else if (mode === 'mul') {
    const [a, b, c, d] = o.f || [2, 3, 3, 4];
    const W = 300, H = 200, x0 = 150, y0 = 30;
    for (let i = 0; i < b; i++) for (let j = 0; j < d; j++) {
      const inA = i < a, inC = j < c;
      sv('rect', { x: x0 + i * W / b, y: y0 + j * H / d, width: W / b, height: H / d, fill: inA && inC ? C.acc : inA ? 'var(--soft-blue)' : inC ? 'var(--soft-warn)' : C.card, stroke: C.ink, 'stroke-width': 1.2 }, g);
    }
    sv('text', { x: x0 + W / 2, y: 22, 'text-anchor': 'middle', 'font-size': 16, fill: C.blue, text: `${a}/${b} de la largeur` }, g);
    sv('text', { x: x0 - 10, y: y0 + H / 2, 'text-anchor': 'end', 'font-size': 16, fill: C.warn, text: `${c}/${d} de la hauteur` }, g);
    cap.innerHTML = `Le carré entier est découpé en ${b}×${d} = ${b * d} cases. La zone orange contient ${a}×${c} = ${a * c} cases : ${F(a, b)} × ${F(c, d)} = ${F(a * c, b * d)}. On multiplie les numérateurs entre eux et les dénominateurs entre eux.`;
  }
  el.append(ctrl, cap);
});

/* ---------- puissances ---------- */
widget('powers', (el, o) => {
  const box = h('div', { style: 'font-size:1.25rem;text-align:center;padding:10px;min-height:96px' });
  const ctrl = h('div', { class: 'ctrl' }), cap = h('div', { class: 'cap' });
  let a = o.a || 2, n = o.n ?? 3;
  const draw = () => {
    const base = a < 0 ? `(${nf(a)})` : nf(a);
    let html;
    if (n > 0) html = `${base}<sup>${n}</sup> = ${Array(n).fill(base).join(' × ')} = <b>${nf(Math.pow(a, n))}</b>`;
    else if (n === 0) html = `${base}<sup>0</sup> = <b>1</b>`;
    else html = `${base}<sup>${nf(n)}</sup> = ${F(1, base + '<sup>' + (-n) + '</sup>')} = ${F(1, Array(-n).fill(base).join(' × '))} = ${F(1, nf(Math.pow(a, -n)))} = <b>${nf(Math.pow(a, n))}</b>`;
    box.innerHTML = html;
    cap.innerHTML = n > 0 ? `L’exposant ${n} compte les facteurs ${base} qu’on multiplie.` : n === 0 ? 'Par convention, un nombre non nul à la puissance 0 vaut 1 (on n’a multiplié aucun facteur).' : `Un exposant négatif signifie « l’inverse » : on divise 1 par ${base} répété ${-n} fois. Ce n’est <b>pas</b> un nombre négatif !`;
  };
  slider(ctrl, 'Nombre a', o.amin ?? 2, o.amax ?? 10, 1, a, v => { a = v; draw(); });
  slider(ctrl, 'Exposant n', -4, 6, 1, n, v => { n = v; draw(); });
  el.append(box, ctrl, cap);
});
widget('powrule', (el, o) => {
  const box = h('div', { style: 'font-size:1.2rem;text-align:center;padding:10px;min-height:120px' });
  const ctrl = h('div', { class: 'ctrl' });
  let m = 3, n = 2, rule = 0;
  const f = (k, col) => `<span style="background:${col};color:#fff;border-radius:6px;padding:0 6px;margin:1px">a</span>`;
  const draw = () => {
    if (rule === 0) box.innerHTML = `a<sup>${m}</sup> × a<sup>${n}</sup> = (${Array(m).fill(f(0, 'var(--accent2)')).join('×')}) × (${Array(n).fill(f(0, 'var(--accent)')).join('×')})<br>= a<sup>${m}+${n}</sup> = <b>a<sup>${m + n}</sup></b><br><span class="small muted">On ajoute les exposants (on ne les multiplie pas).</span>`;
    else if (rule === 1) box.innerHTML = `(a<sup>${m}</sup>)<sup>${n}</sup> = ${Array(n).fill('(' + Array(m).fill(f(0, 'var(--accent2)')).join('×') + ')').join(' × ')}<br>= a<sup>${m}×${n}</sup> = <b>a<sup>${m * n}</sup></b><br><span class="small muted">${n} paquets de ${m} facteurs : on multiplie les exposants.</span>`;
    else box.innerHTML = `${F('a<sup>' + m + '</sup>', 'a<sup>' + n + '</sup>')} = ${F(Array(m).fill(f(0, 'var(--accent2)')).map((x, i) => i < Math.min(m, n) ? '<s>' + x + '</s>' : x).join('×'), Array(n).fill(f(0, 'var(--accent)')).map((x, i) => i < Math.min(m, n) ? '<s>' + x + '</s>' : x).join('×') || '1')} = <b>a<sup>${m}−${n}</sup> = a<sup>${m - n}</sup></b><br><span class="small muted">Les facteurs communs se simplifient : on soustrait les exposants.</span>`;
  };
  wbtns(el, ['a<sup>m</sup> × a<sup>n</sup>', '(a<sup>m</sup>)<sup>n</sup>', 'a<sup>m</sup> ÷ a<sup>n</sup>'], i => { rule = i; draw(); });
  slider(ctrl, 'm', 1, 5, 1, m, v => { m = v; draw(); });
  slider(ctrl, 'n', 1, 4, 1, n, v => { n = v; draw(); });
  el.append(box, ctrl);
});

/* ---------- modèle d'aires : distributivité et identités ---------- */
widget('area', (el, o) => {
  const mode = o.mode || 'sq+';
  const svg = svgRoot(600, 330, el);
  const g = sv('g', {}, svg);
  const ctrl = h('div', { class: 'ctrl' }), cap = h('div', { class: 'cap' });
  let a = o.a || 5, b = o.b || 2;
  const rect = (x, y, w, hh, col, lab) => {
    sv('rect', { x, y, width: w, height: hh, fill: col, stroke: C.ink, 'stroke-width': 1.5, opacity: .9 }, g);
    if (w > 26 && hh > 20) sv('text', { x: x + w / 2, y: y + hh / 2 + 6, 'text-anchor': 'middle', 'font-size': Math.min(20, w / 3.2), 'font-weight': 700, fill: '#fff', text: lab }, g);
  };
  const draw = () => {
    g.innerHTML = '';
    const u = 270 / Math.max(a + b, 1), x0 = 160, y0 = 20;
    if (mode === 'dist') {
      const k = o.k || 3, uu = 400 / (a + b), hk = k * 36;
      rect(x0 - 100, y0 + 40, a * uu, hk, C.blue, `${k}×${a}`);
      rect(x0 - 100 + a * uu, y0 + 40, b * uu, hk, C.acc, `${k}×${b}`);
      sv('text', { x: x0 - 100 + a * uu / 2, y: y0 + 30, 'text-anchor': 'middle', 'font-size': 18, fill: C.blue, text: 'a = ' + a }, g);
      sv('text', { x: x0 - 100 + a * uu + b * uu / 2, y: y0 + 30, 'text-anchor': 'middle', 'font-size': 18, fill: C.acc, text: 'b = ' + b }, g);

      return;
    }
    if (mode === 'sq+') {
      rect(x0, y0, a * u, a * u, C.blue, 'a²'); rect(x0 + a * u, y0, b * u, a * u, C.warn, 'ab'); rect(x0, y0 + a * u, a * u, b * u, C.warn, 'ab'); rect(x0 + a * u, y0 + a * u, b * u, b * u, C.acc, 'b²');
      sv('text', { x: x0 + a * u / 2, y: y0 + (a + b) * u + 22, 'text-anchor': 'middle', 'font-size': 17, fill: C.ink, text: 'a = ' + a }, g);
      sv('text', { x: x0 + a * u + b * u / 2, y: y0 + (a + b) * u + 22, 'text-anchor': 'middle', 'font-size': 17, fill: C.ink, text: 'b = ' + b }, g);
      cap.innerHTML = `Le grand carré a pour côté a + b = ${a + b}, donc pour aire (a + b)² = ${(a + b) ** 2}.<br>Il contient a² = ${a * a}, b² = ${b * b} <b>et deux rectangles</b> ab = ${a * b} : ${a * a} + ${2 * a * b} + ${b * b} = ${(a + b) ** 2}.<br><b>(a + b)² = a² + 2ab + b²</b>, et non a² + b² (il manquerait les deux rectangles jaunes).`;
    } else if (mode === 'sq-') {
      const s = a * u, t = b * u;
      rect(x0, y0, s, s, C.card, '');
      rect(x0, y0, s - t, s - t, C.blue, '(a−b)²'); rect(x0 + s - t, y0, t, s, C.warn, 'ab'); rect(x0, y0 + s - t, s - t, t, 'var(--ko)', '');
      rect(x0 + s - t, y0 + s - t, t, t, C.acc, 'b²');
      cap.innerHTML = `Dans le carré a² = ${a * a}, on enlève une bande ab (jaune) et une bande ab (qui chevauche le petit carré b²). On a retiré b² une fois de trop, on le rajoute :<br><b>(a − b)² = a² − 2ab + b²</b> = ${a * a} − ${2 * a * b} + ${b * b} = ${(a - b) ** 2}.`;
      sv('text', { x: x0 + s / 2, y: y0 + s + 22, 'text-anchor': 'middle', 'font-size': 17, fill: C.ink, text: 'côté a = ' + a + ', b = ' + b }, g);
    } else if (mode === 'diff') {
      const s = a * u, t = b * u;
      rect(x0, y0, s - t, s, C.blue, ''); rect(x0 + s - t, y0, t, s - t, C.blue, '');
      rect(x0 + s - t, y0 + s - t, t, t, C.card, 'b²');
      sv('text', { x: x0 + (s - t) / 2, y: y0 + s / 2, 'text-anchor': 'middle', 'font-size': 18, fill: '#fff', 'font-weight': 700, text: 'a² − b²' }, g);
      cap.innerHTML = `On enlève le carré b² du carré a² : il reste a² − b² = ${a * a} − ${b * b} = ${a * a - b * b}. En déplaçant le morceau du haut à droite, on obtient un rectangle de côtés (a + b) et (a − b) : ${a + b} × ${a - b} = ${(a + b) * (a - b)}.<br><b>(a + b)(a − b) = a² − b²</b>`;
    }
  };
  slider(ctrl, 'a', mode === 'dist' ? 1 : 3, 9, 1, a, v => { a = v; if (mode !== 'sq+' && mode !== 'dist' && b >= a) b = a - 1; draw(); });
  slider(ctrl, 'b', 1, mode === 'sq+' || mode === 'dist' ? 6 : 8, 1, b, v => { b = (mode !== 'sq+' && mode !== 'dist') ? Math.min(v, a - 1) : v; draw(); });
  el.append(ctrl, cap); draw();
});

    for (let i = 0; i < nu; i++) { sv('circle', { cx: px + 10, cy: 136, r: 10, fill: C.acc }, g); px += 22; }
    let qx = 444, row = 0;
    for (let i = 0; i < nr; i++) { sv('circle', { cx: qx + 10, cy: 136 - row * 22, r: 10, fill: C.acc }, g); qx += 22; if (qx > 560) { qx = 444; row++; } }
    eqLine.innerHTML = st === 0 ? `${A}${M('x')} + ${B} = ${Cc}` : st === 1 ? `${A}${M('x')} = ${Cc - B}` : `${M('x')} = ${nf(xval)}`;
    cap.innerHTML = st === 0 ? 'La balance est en équilibre : les deux côtés ont la même valeur. Chaque boîte bleue vaut x, chaque boule vaut 1.' :

  };

});

/* ---------- graphique de fonction ---------- */
widget('graph', (el, o) => {
  const W = 600, H = 400, pad = 36;
  const xmin = o.xmin ?? -5, xmax = o.xmax ?? 5, ymin = o.ymin ?? -5, ymax = o.ymax ?? 5;
  const X = x => pad + (x - xmin) * (W - 2 * pad) / (xmax - xmin), Y = y => H - pad - (y - ymin) * (H - 2 * pad) / (ymax - ymin);
  const svg = svgRoot(W, H, el);
  const grid = sv('g', {}, svg);
  for (let x = Math.ceil(xmin); x <= xmax; x++) sv('line', { x1: X(x), y1: Y(ymin), x2: X(x), y2: Y(ymax), stroke: C.line, 'stroke-width': 1 }, grid);
  for (let y = Math.ceil(ymin); y <= ymax; y++) sv('line', { x1: X(xmin), y1: Y(y), x2: X(xmax), y2: Y(y), stroke: C.line, 'stroke-width': 1 }, grid);
  sv('line', { x1: X(xmin), y1: Y(0), x2: X(xmax), y2: Y(0), stroke: C.ink, 'stroke-width': 1.8 }, grid);
  sv('line', { x1: X(0), y1: Y(ymin), x2: X(0), y2: Y(ymax), stroke: C.ink, 'stroke-width': 1.8 }, grid);
  const lstep = o.lstep || (xmax - xmin > 12 ? 2 : 1);
  for (let x = Math.ceil(xmin); x <= xmax; x++) if (x && x % lstep === 0) sv('text', { x: X(x), y: Y(0) + 18, 'text-anchor': 'middle', 'font-size': 13, fill: C.ink2, text: nf(x) }, grid);
  for (let y = Math.ceil(ymin); y <= ymax; y++) if (y && y % (o.ylstep || lstep) === 0) sv('text', { x: X(0) - 6, y: Y(y) + 4, 'text-anchor': 'end', 'font-size': 13, fill: C.ink2, text: nf(y) }, grid);
  sv('text', { x: X(0) - 6, y: Y(0) + 16, 'text-anchor': 'end', 'font-size': 13, fill: C.ink2, text: '0' }, grid);
  const curves = sv('g', {}, svg), top = sv('g', {}, svg);
  const ctrl = h('div', { class: 'ctrl' }), cap = h('div', { class: 'cap' });
  const cols = [C.blue, C.acc, C.ok, C.pc];
  let fns = o.fns || [];
  let m = o.m ?? 1, p = o.p ?? 1, x = o.x ?? 1, k = o.k ?? 2, px = o.px ?? 1, py = o.py ?? 2;
  const pathOf = f => {
    let d = '', pen = false;
    for (let i = 0; i <= 600; i++) {
      const xx = xmin + (xmax - xmin) * i / 600, yy = f(xx);
      if (!isFinite(yy) || yy > ymax + 50 || yy < ymin - 50) { pen = false; continue; }
      const prev = i ? f(xmin + (xmax - xmin) * (i - 1) / 600) : yy;
      if (pen && Math.abs(yy - prev) > (ymax - ymin)) pen = false;
      d += (pen ? 'L' : 'M') + X(xx).toFixed(1) + ' ' + Y(Math.max(ymin - 1, Math.min(ymax + 1, yy))).toFixed(1); pen = true;
    }
    return d;
  };
  const clip = sv('clipPath', { id: 'clip' + (el.id = 'g' + Math.random().toString(36).slice(2)) }, svg);
  sv('rect', { x: pad, y: pad, width: W - 2 * pad, height: H - 2 * pad }, clip);
  curves.setAttribute('clip-path', `url(#${clip.id})`);
  const drawCurves = () => {
    curves.innerHTML = '';
    if (o.mode === 'affine') fns = [{ f: t => m * t + p, label: '' }];
    (o.points || []).forEach(([px0, py0, lab]) => { sv('circle', { cx: X(px0), cy: Y(py0), r: 7, fill: C.acc }, curves); if (lab) sv('text', { x: X(px0) + 10, y: Y(py0) - 10, 'font-size': 17, 'font-weight': 700, fill: C.acc, text: lab }, curves); });
    fns.forEach((fn, i) => {
      sv('path', { d: pathOf(fn.f), fill: 'none', stroke: fn.color || cols[i], 'stroke-width': 3 }, curves);
      if (fn.label) { const lx = fn.lx ?? xmax - 0.6; sv('text', { x: X(lx), y: Y(Math.max(ymin + .5, Math.min(ymax - .5, fn.f(lx)))) - 10, 'text-anchor': 'end', 'font-size': 16, 'font-weight': 700, fill: fn.color || cols[i], text: fn.label }, curves); }
    });
  };
  const roots = (f, kk) => { const r = []; const N = 2000; let prev = f(xmin) - kk; for (let i = 1; i <= N; i++) { const xx = xmin + (xmax - xmin) * i / N, v = f(xx) - kk; if (!isFinite(v) || !isFinite(prev)) { prev = v; continue; } if (v === 0 || prev * v < 0) { if (Math.abs(f(xx) - kk) < (ymax - ymin) / 20) r.push(+xx.toFixed(2)); } prev = v; } return r.filter((v, i, a) => !i || Math.abs(v - a[i - 1]) > .05); };
  const draw = () => {
    top.innerHTML = '';
    const f = fns[0] && fns[0].f;
    if (o.mode === 'image') {
      const y = f(x);
      if (isFinite(y)) {
        sv('line', { x1: X(x), y1: Y(0), x2: X(x), y2: Y(y), stroke: C.acc, 'stroke-width': 2, 'stroke-dasharray': '6 5' }, top);
        sv('line', { x1: X(x), y1: Y(y), x2: X(0), y2: Y(y), stroke: C.acc, 'stroke-width': 2, 'stroke-dasharray': '6 5' }, top);
        sv('circle', { cx: X(x), cy: Y(y), r: 8, fill: C.acc }, top);

      } else cap.innerHTML = `${nf(x)} n’a pas d’image : la fonction n’est pas définie en ce point.`;
    } else if (o.mode === 'antecedent' || o.mode === 'ineq') {

      sv('text', { x: X(xmin) + 4, y: Y(k) - 8, 'font-size': 15, fill: C.acc, 'font-weight': 700, text: 'y = ' + nf(k) }, top);
      const rs = roots(f, k);
      rs.forEach(r => { sv('line', { x1: X(r), y1: Y(k), x2: X(r), y2: Y(0), stroke: C.blue, 'stroke-width': 2, 'stroke-dasharray': '5 4' }, top); sv('circle', { cx: X(r), cy: Y(k), r: 7, fill: C.acc }, top); sv('circle', { cx: X(r), cy: Y(0), r: 6, fill: C.blue }, top); });
      if (o.mode === 'ineq') {
        let inside = false, start = null;
        const segs = [];
        for (let i = 0; i <= 600; i++) { const xx = xmin + (xmax - xmin) * i / 600, yy = f(xx); const ins = isFinite(yy) && yy < k; if (ins && !inside) { start = xx; inside = true; } if ((!ins || i === 600) && inside) { segs.push([start, xx]); inside = false; } }
        segs.forEach(([s0, s1]) => sv('line', { x1: X(s0), y1: Y(0), x2: X(s1), y2: Y(0), stroke: C.ok, 'stroke-width': 8, opacity: .8 }, top));
        cap.innerHTML = `Les solutions de ${M('f')}(${M('x')}) &lt; ${nf(k)} sont les ${M('x')} pour lesquels la courbe est <b>sous</b> la droite y = ${nf(k)} : en vert sur l’axe des abscisses.` + (rs.length ? ` Les bornes sont les abscisses des points d’intersection : ${rs.map(v => nf(v)).join(' ; ')}.` : '');
      } else cap.innerHTML = rs.length ? `On part de la hauteur <b style="color:var(--accent)">${nf(k)}</b> sur l’axe vertical, on va jusqu’à la courbe, et on descend lire ${M('x')}. Antécédent(s) de ${nf(k)} : <b style="color:var(--accent2)">${rs.map(v => nf(v)).join(' ; ')}</b>. Il peut y en avoir plusieurs… ou aucun.` : `La droite y = ${nf(k)} ne coupe pas la courbe : ${nf(k)} n’a <b>aucun antécédent</b>.`;

      if (f) { const on = Math.abs(f(px) - py) < 1e-9; cap.innerHTML = `Le point A a pour coordonnées (${nf(px)} ; ${nf(py)}). ${M('f')}(${nf(px)}) = ${nf(+f(px).toFixed(3))}. ${on ? '<b style="color:var(--ok)">Les deux nombres sont égaux : A est sur la courbe.</b>' : '<b style="color:var(--ko)">' + nf(+f(px).toFixed(3)) + ' ≠ ' + nf(py) + ' : A n’est pas sur la courbe.</b>'}`; }

/* ---------- racine carrée = côté d'un carré ---------- */
widget('sqroot', (el, o) => {

    sv('text', { x: 300, y: 130, 'font-size': 16, fill: C.ink2, text: exact ? `car ${nf(s)}² = ${nf(A)}` : `car ${nf(+s.toFixed(3))}² ≈ ${nf(A)}` }, g);

/* ---------- multiples, diviseurs, nombres premiers : rectangles ---------- */
widget('rects', (el, o) => {
  const box = h('div', { style: 'display:flex;flex-wrap:wrap;gap:14px;justify-content:center;min-height:120px;padding:8px' });
  const ctrl = h('div', { class: 'ctrl' }), cap = h('div', { class: 'cap' });
  let n = o.n || 12;
  const draw = () => {
    box.innerHTML = '';
    const divs = []; for (let d = 1; d <= n; d++) if (n % d === 0) divs.push(d);
    divs.filter(d => d <= n / d).forEach(d => {
      const w = n / d, cell = Math.max(6, Math.min(16, 180 / Math.max(w, d)));
      const s = svgRoot(w * cell + 4, d * cell + 4, null); s.style.width = (w * cell + 4) + 'px'; s.style.maxWidth = '100%';
      for (let i = 0; i < d; i++) for (let j = 0; j < w; j++) sv('circle', { cx: 2 + j * cell + cell / 2, cy: 2 + i * cell + cell / 2, r: cell * .38, fill: divs.length === 2 ? C.acc : C.blue }, s);
      box.append(h('div', { style: 'text-align:center' }, s, h('div', { class: 'small' }, `${d} × ${w}`)));
    });
    const prime = divs.length === 2;
    cap.innerHTML = `${n} points peuvent être rangés en ${divs.filter(d => d <= n / d).length} rectangle(s). Diviseurs de ${n} : <b>${divs.join(' ; ')}</b>.` +
      (n === 1 ? ' 1 n’a qu’un seul diviseur : il n’est <b>pas premier</b>.' : prime ? ` <b style="color:var(--accent)">${n} est premier</b> : seulement deux diviseurs, 1 et lui-même (une seule ligne possible).` : ` ${n} n’est pas premier.`) +
      (n % 2 === 0 ? ` ${n} est pair (multiple de 2).` : ` ${n} est impair.`);
  };

});
widget('pairs', (el, o) => {
  const svg = svgRoot(600, 120, el);

    cap.innerHTML = n % 2 ? `${n} = 2 × ${k} + 1 : on fait ${k} paires et il reste <b style="color:var(--accent)">un point seul</b>. ${n} est <b>impair</b> : il s’écrit 2k + 1.` : `${n} = 2 × ${k} : tous les points sont en paires. ${n} est <b>pair</b> : il s’écrit 2k.`;

/* ---------- décomposition en facteurs premiers ---------- */
widget('ftree', (el, o) => {
  const out = h('div', { style: 'text-align:center;font-size:1.1rem;min-height:140px' });
  const cap = h('div', { class: 'cap' });
  const nums = o.nums || [60, 84, 126, 90, 210, 72];
  const draw = n => {
    const steps = []; let r = n, d = 2; const fac = [];
    while (r > 1) { if (r % d === 0) { steps.push(`${r} = ${d} × ${r / d}`); fac.push(d); r /= d; } else d++; }
    out.innerHTML = steps.map((s, i) => `<div style="margin-left:${i * 22}px;text-align:left;display:inline-block;width:100%">${s}${fac[i] ? ' <span style="color:var(--accent)">← ' + fac[i] + ' est premier</span>' : ''}</div>`).join('') +
      `<div class="formula">${n} = ${fac.join(' × ')}</div>`;
    cap.innerHTML = 'À chaque étape, on divise par le plus petit nombre premier possible (2, puis 3, 5, 7…) jusqu’à arriver à 1.';
  };
  wbtns(el, nums.map(String), i => draw(nums[i]));
  el.append(out, cap); draw(nums[0]);
});

/* ---------- encadrement par zooms successifs ---------- */
widget('zoom', (el, o) => {
  const val = o.val ?? Math.SQRT2, name = o.name || '√2';
  const svg = svgRoot(600, 120, el);
  const g = sv('g', {}, svg);

  let lvl = 0;
  const draw = () => {
    g.innerHTML = '';
    const step = Math.pow(10, -lvl), lo = Math.floor(val / step) * step;
    const min = +lo.toFixed(lvl), max = +(lo + step).toFixed(lvl);
    const X = drawAxis(g, { min, max, step: step / 10, labelEvery: 5, x0: 40, x1: 560 });
    sv('circle', { cx: X(val), cy: 70, r: 8, fill: C.acc }, g);
    sv('text', { x: X(val), y: 40, 'text-anchor': 'middle', 'font-size': 18, 'font-weight': 700, fill: C.acc, text: name }, g);
    const lo2 = Math.floor(val / (step / 10)) * step / 10;
    cap.innerHTML = `Encadrement à ${nf(step / 10)} près (amplitude ${nf(step / 10)}) : <b>${nf(+lo2.toFixed(lvl + 1))} &lt; ${name} &lt; ${nf(+(lo2 + step / 10).toFixed(lvl + 1))}</b>. Arrondi au ${['dixième', 'centième', 'millième', 'dix-millième'][lvl]} : ${nf(+val.toFixed(lvl + 1))}.`;
  };
  wbtns(el, ['Unités', 'Zoom ×10', 'Zoom ×100', 'Zoom ×1000'], i => { lvl = i; draw(); });
  el.append(cap); draw();
});

/* ---------- déroulé pas à pas (calculs) ---------- */
widget('steps', (el, o) => {
  const box = h('div', { style: 'font-size:1.15rem' });
  let k = 0;
  const btn = h('button', { class: 'wbtn', onclick: () => { k++; draw(); } }, 'Étape suivante');
  const draw = () => {
    box.innerHTML = o.lines.slice(0, k + 1).map((l, i) => `<div style="padding:6px 0;${i === k ? 'animation:pop .3s' : 'opacity:.75'}">${l}</div>`).join('');
    btn.style.display = k >= o.lines.length - 1 ? 'none' : '';
  };
  el.append(box, h('div', { class: 'wbtns' }, btn)); draw();
});

<script>
'use strict';
/* ============ Visuels : maths (suite) ============ */
const V = s => `<span class="vec">${s}</span>`;
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const PY = lines => `<div class="code">${lines.map(l => `<div>${esc(l) || ' '}</div>`).join('')}</div>`;
const OV = s => s + '̅';            // lettre surlignée (événement contraire)
const subD = n => String(n).replace(/\d/g, d => '₀₁₂₃₄₅₆₇₈₉'[d]);

function arrowSvg(g, x1, y1, x2, y2, col, w, lab) {
  const L = Math.hypot(x2 - x1, y2 - y1);
  if (L < 2) { sv('circle', { cx: x1, cy: y1, r: 5, fill: col }, g); return; }
  const ux = (x2 - x1) / L, uy = (y2 - y1) / L, hl = Math.min(15, L * .45);
  sv('line', { x1, y1, x2: x2 - ux * hl * .7, y2: y2 - uy * hl * .7, stroke: col, 'stroke-width': w || 3, 'stroke-linecap': 'round' }, g);
  sv('path', { d: `M${x2} ${y2} L${x2 - ux * hl - uy * hl * .45} ${y2 - uy * hl + ux * hl * .45} L${x2 - ux * hl + uy * hl * .45} ${y2 - uy * hl - ux * hl * .45} Z`, fill: col }, g);
  if (lab) sv('text', { x: (x1 + x2) / 2 - uy * 18, y: (y1 + y2) / 2 + ux * 18 + 6, 'text-anchor': 'middle', 'font-size': 18, 'font-weight': 700, fill: col, text: lab }, g);
}
function gridSvg(svg, o) {
  o = o || {};
  const u = o.u || 36, ox = o.ox ?? 300, oy = o.oy ?? 200, W = o.W || 600, H = o.H || 400;
  const g = sv('g', {}, svg);
  for (let x = ox % u; x <= W; x += u) sv('line', { x1: x, y1: 0, x2: x, y2: H, stroke: C.line, 'stroke-width': 1 }, g);
  for (let y = oy % u; y <= H; y += u) sv('line', { x1: 0, y1: y, x2: W, y2: y, stroke: C.line, 'stroke-width': 1 }, g);
  if (o.axes !== false) {
    sv('line', { x1: 0, y1: oy, x2: W, y2: oy, stroke: C.ink2, 'stroke-width': 1.8 }, g);
    sv('line', { x1: ox, y1: 0, x2: ox, y2: H, stroke: C.ink2, 'stroke-width': 1.8 }, g);
    sv('text', { x: ox - 6, y: oy + 18, 'text-anchor': 'end', 'font-size': 14, fill: C.ink2, text: 'O' }, g);
    sv('text', { x: ox + u, y: oy + 18, 'text-anchor': 'middle', 'font-size': 14, fill: C.ink2, text: '1' }, g);
    sv('text', { x: ox - 8, y: oy - u + 5, 'text-anchor': 'end', 'font-size': 14, fill: C.ink2, text: '1' }, g);
  }
  return (x, y) => [ox + x * u, oy - y * u];
}
// tableau de variations : vtab({x:['−3','1','4'], f:[['2','h'],['−5','l'],['6','h']]})
function vtab(t) {
  const n = t.x.length, cols = 2 * n - 1, rk = { l: 0, m: 1, h: 2 };
  let s = `<div class="vt" style="grid-template-columns:auto repeat(${cols},1fr)"><div class="vth vtx">x</div>`;
  t.x.forEach((v, i) => { s += `<div class="vtx">${v}</div>`; if (i < n - 1) s += '<div class="vtx"></div>'; });
  s += `<div class="vth">${t.name || 'f'}</div>`;
  t.f.forEach(([v, p], i) => { s += `<div class="vtv ${p}">${v}</div>`; if (i < n - 1) s += `<div class="vta">${rk[t.f[i + 1][1]] > rk[p] ? '↗' : '↘'}</div>`; });
  return s + '</div>';
}
// tableau de signes : stab(['−∞','−3','1','+∞'], [['x + 3', ['', '−', '0', '+', '', '+', '']], ...])
function stab(xs, rows) {
  const cols = 2 * xs.length - 1;
  let s = `<div class="vt" style="grid-template-columns:auto repeat(${cols},1fr)"><div class="vth vtx">x</div>`;
  xs.forEach((v, i) => { s += `<div class="vtx">${v}</div>`; if (i < xs.length - 1) s += '<div class="vtx"></div>'; });
  rows.forEach((r, k) => { const b = k < rows.length - 1 ? ' stb' : ''; s += `<div class="vth${b}">${r[0]}</div>`; r[1].forEach(c => { s += `<div class="stc${b}">${c}</div>`; }); });
  return s + '</div>';
}

/* ---------- vecteurs ---------- */
widget('vec', (el, o) => {
  const mode = o.mode || 'translate';
  const svg = svgRoot(600, 400, el);
  const P = gridSvg(svg, { axes: mode !== 'translate' });
  const g = sv('g', {}, svg);
  const ctrl = h('div', { class: 'ctrl' }), cap = h('div', { class: 'cap' });
  let ux = o.ux ?? 3, uy = o.uy ?? 2, vx = o.vx ?? 2, vy = o.vy ?? -3, xa = o.xa ?? -4, ya = o.ya ?? -2, xb = o.xb ?? 3, yb = o.yb ?? 2, k = o.k ?? 2;
  const ar = (x1, y1, x2, y2, col, lab, w) => { const [a, b] = P(x1, y1), [c, d] = P(x2, y2); arrowSvg(g, a, b, c, d, col, w || 3.5, lab); };
  const pt = (x, y, lab, col, dx = -8, dy = -10) => { const [a, b] = P(x, y); sv('circle', { cx: a, cy: b, r: 5, fill: col || C.ink }, g); if (lab) sv('text', { x: a + dx, y: b + dy, 'text-anchor': dx < 0 ? 'end' : 'start', 'font-size': 17, 'font-weight': 700, fill: col || C.ink, text: lab }, g); };
  const dash = (x1, y1, x2, y2, col) => { const [a, b] = P(x1, y1), [c, d] = P(x2, y2); sv('line', { x1: a, y1: b, x2: c, y2: d, stroke: col, 'stroke-width': 2.2, 'stroke-dasharray': '7 5' }, g); };
  const norm = (x, y) => { const n2 = x * x + y * y, s = Math.sqrt(n2); return Number.isInteger(s) ? nf(s) : `${R(nf(n2))} ≈ ${nf(+s.toFixed(2))}`; };
  const draw = () => {
    g.innerHTML = '';
    if (mode === 'translate') {
      const T = [[-6, -2], [-3, -3], [-4, 1]], names = ['A', 'B', 'C'];
      const poly = (pts, col) => sv('polygon', { points: pts.map(([x, y]) => P(x, y).join(',')).join(' '), fill: col, 'fill-opacity': .22, stroke: col, 'stroke-width': 2 }, g);
      poly(T, C.blue); poly(T.map(([x, y]) => [x + ux, y + uy]), C.acc);
      T.forEach(([x, y], i) => { ar(x, y, x + ux, y + uy, C.ok, i === 2 ? 'u' : ''); pt(x, y, names[i], C.blue); pt(x + ux, y + uy, names[i] + '’', C.acc, 8, -10); });
      cap.innerHTML = `La translation de vecteur ${V('u')} déplace <b>tous les points de la même façon</b> : ${V('AA’')} = ${V('BB’')} = ${V('CC’')} = ${V('u')}. Les flèches vertes ont la même <b>direction</b>, le même <b>sens</b> et la même <b>longueur</b> (la norme : ${norm(ux, uy)} carreaux). La figure est simplement glissée, sans tourner ni changer de taille.`;
    } else if (mode === 'sum') {
      const x0 = -6, y0 = 0;
      dash(x0, y0, x0 + vx, y0 + vy, C.ink2); dash(x0 + vx, y0 + vy, x0 + ux + vx, y0 + uy + vy, C.ink2);
      ar(x0, y0, x0 + ux, y0 + uy, C.blue, 'u'); ar(x0 + ux, y0 + uy, x0 + ux + vx, y0 + uy + vy, C.acc, 'v'); ar(x0, y0, x0 + ux + vx, y0 + uy + vy, C.ok, 'u + v', 4.5);
      pt(x0, y0, 'A'); pt(x0 + ux, y0 + uy, 'B', null, 8, -10); pt(x0 + ux + vx, y0 + uy + vy, 'C', null, 8, -10);
      cap.innerHTML = `On enchaîne les translations : de A à B (vecteur ${V('u')}), puis de B à C (vecteur ${V('v')}). C’est comme aller directement de A à C : <b>${V('AB')} + ${V('BC')} = ${V('AC')}</b>, c’est la <b>relation de Chasles</b>. En pointillés, la règle du parallélogramme donne le même résultat.<br>En coordonnées : ${V('u')}(${nf(ux)} ; ${nf(uy)}) + ${V('v')}(${nf(vx)} ; ${nf(vy)}) = (${nf(ux + vx)} ; ${nf(uy + vy)}) : on additionne les abscisses entre elles et les ordonnées entre elles.`;
    } else if (mode === 'coord') {
      const dx = xb - xa, dy = yb - ya;
      dash(xa, ya, xb, ya, C.blue); dash(xb, ya, xb, yb, C.pc);
      ar(xa, ya, xb, yb, C.acc, '', 4);
      const [hx, hy] = P((xa + xb) / 2, ya), [vx0, vy0] = P(xb, (ya + yb) / 2);
      if (dx) sv('text', { x: hx, y: hy + (dy >= 0 ? 22 : -10), 'text-anchor': 'middle', 'font-size': 17, 'font-weight': 700, fill: C.blue, text: (dx > 0 ? '+' : '') + nf(dx) }, g);
      if (dy) sv('text', { x: vx0 + (dx >= 0 ? 10 : -10), y: vy0 + 6, 'text-anchor': dx >= 0 ? 'start' : 'end', 'font-size': 17, 'font-weight': 700, fill: C.pc, text: (dy > 0 ? '+' : '') + nf(dy) }, g);
      pt(xa, ya, 'A', C.ink); pt(xb, yb, 'B', C.ink, 8, -10);
      pt((xa + xb) / 2, (ya + yb) / 2, 'M', C.ok, -8, 20);
      cap.innerHTML = `A(${nf(xa)} ; ${nf(ya)}) et B(${nf(xb)} ; ${nf(yb)}). Pour aller de A à B : <b style="color:var(--accent2)">${nf(dx)}</b> horizontalement et <b style="color:var(--pc)">${nf(dy)}</b> verticalement.<br>${V('AB')}(x<sub>B</sub> − x<sub>A</sub> ; y<sub>B</sub> − y<sub>A</sub>) = (${nf(xb)} − ${par(xa)} ; ${nf(yb)} − ${par(ya)}) = <b>(${nf(dx)} ; ${nf(dy)})</b>.<br>Longueur : AB = ${R('x² + y²')} = ${R(par(dx) + '² + ' + par(dy) + '²')} = ${norm(dx, dy)}.<br>Milieu M de [AB] : (${F('x<sub>A</sub> + x<sub>B</sub>', 2)} ; ${F('y<sub>A</sub> + y<sub>B</sub>', 2)}) = (${nf((xa + xb) / 2)} ; ${nf((ya + yb) / 2)}).`;
    } else if (mode === 'scalar') {
      ar(-7, 3, -7 + ux, 3 + uy, C.blue, 'u');
      ar(-1, -1, -1 + k * ux, -1 + k * uy, k < 0 ? C.ko : C.acc, k === 0 ? '' : nf(k) + 'u');
      if (k === 0) pt(-1, -1, '0⃗', C.acc);
      cap.innerHTML = `${V('u')}(${nf(ux)} ; ${nf(uy)}) et ${nf(k)}${V('u')}(${nf(k * ux)} ; ${nf(k * uy)}) : on multiplie chaque coordonnée par ${nf(k)}. ` +
        (k === 0 ? 'On obtient le vecteur nul.' : `Même <b>direction</b> (les flèches sont parallèles) : les vecteurs sont <b>colinéaires</b>. ${k > 0 ? 'Même <b>sens</b>' : '<b>Sens opposé</b> (k est négatif)'}, et une longueur multipliée par ${nf(Math.abs(k))}.`);
    } else if (mode === 'det') {
      const d = ux * vy - uy * vx;
      sv('polygon', { points: [P(0, 0), P(ux, uy), P(ux + vx, uy + vy), P(vx, vy)].map(p => p.join(',')).join(' '), fill: d === 0 ? C.ko : C.warn, 'fill-opacity': .25 }, g);
      ar(0, 0, ux, uy, C.blue, 'u'); ar(0, 0, vx, vy, C.acc, 'v');
      cap.innerHTML = `det(${V('u')}, ${V('v')}) = x × y’ − y × x’ = ${par(ux)} × ${par(vy)} − ${par(uy)} × ${par(vx)} = <b>${nf(d)}</b>. ` +
        (d === 0 ? '<b style="color:var(--ok)">Le déterminant est nul : les vecteurs sont colinéaires</b> (même direction, le parallélogramme est aplati).' : 'Le déterminant n’est pas nul : les vecteurs ne sont <b>pas colinéaires</b>. (Sa valeur absolue est l’aire du parallélogramme jaune.)');
    }
  };
  const sl = (lab, mn, mx, v, set) => slider(ctrl, lab, mn, mx, 1, v, x => { set(x); draw(); });
  if (mode === 'translate') { sl('u : abscisse', -2, 8, ux, x => ux = x); sl('u : ordonnée', -2, 4, uy, x => uy = x); }
  if (mode === 'sum') { sl('u : x', -2, 6, ux, x => ux = x); sl('u : y', -4, 4, uy, x => uy = x); sl('v : x', -2, 6, vx, x => vx = x); sl('v : y', -4, 4, vy, x => vy = x); }
  if (mode === 'coord') { sl('x<sub>A</sub>', -7, 7, xa, x => xa = x); sl('y<sub>A</sub>', -5, 5, ya, x => ya = x); sl('x<sub>B</sub>', -7, 7, xb, x => xb = x); sl('y<sub>B</sub>', -5, 5, yb, x => yb = x); }
  if (mode === 'scalar') slider(ctrl, 'k', -3, 3, 0.5, k, x => { k = x; draw(); });
  if (mode === 'det') { sl('u : x', -4, 4, ux, x => ux = x); sl('u : y', -4, 4, uy, x => uy = x); sl('v : x', -4, 4, vx, x => vx = x); sl('v : y', -4, 4, vy, x => vy = x); }
  el.append(ctrl, cap);
});

/* ---------- fonctions de référence ---------- */
widget('refs', (el, o) => {
  const defs = [
    ['x²', x => x * x, 'Fonction <b>carré</b> : définie sur ℝ, décroissante sur ]−∞ ; 0] puis croissante sur [0 ; +∞[. La courbe est une <b>parabole</b>, symétrique par rapport à l’axe des ordonnées. Un carré n’est jamais négatif.', { ymin: -1, ymax: 9, xmin: -4, xmax: 4 }],
    ['1/x', x => 1 / x, 'Fonction <b>inverse</b> : définie sur ℝ sauf 0 (on ne divise pas par 0). Décroissante sur ]−∞ ; 0[ et sur ]0 ; +∞[. La courbe est une <b>hyperbole</b>, symétrique par rapport à l’origine.', { ymin: -5, ymax: 5, xmin: -5, xmax: 5 }],
